<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mempool Live - Директно вграждане</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230e1628'/><rect x='4' y='4' width='92' height='92' rx='16' fill='none' stroke='%23f5d742' stroke-width='2'/><text x='50' y='72' font-size='64' text-anchor='middle' fill='%23f5d742'>⛓️</text><text x='88' y='88' font-size='16' font-weight='bold' fill='%23f5d74288' text-anchor='end'>B</text></svg>">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #080c18; color: #e2e8f0; font-family: system-ui, sans-serif; padding: 0.5rem; }
        .container { max-width: 100%; margin: 0 auto; }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: #0e1628;
            border-radius: 16px;
            border: 1px solid #253349;
            margin-bottom: 0.5rem;
        }
        
        .header h1 { font-size: 1.2rem; color: #f5d742; }
        .header .status { display: flex; align-items: center; gap: 0.5rem; color: #7b99cc; font-size: 0.8rem; }
        .status-dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
        
        .controls { display: flex; gap: 0.3rem; flex-wrap: wrap; }
        .controls button {
            background: #1f2f4a;
            border: 1px solid #2a4065;
            color: #c8daf5;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.2s;
        }
        .controls button:hover { background: #2a4065; color: #f5d742; }
        .controls button.primary { background: #f5d742; color: #0b0f1a; border-color: #f5d742; }
        .controls button.primary:hover { background: #e6c82a; }
        .controls button.danger { background: #6b2a2a; border-color: #8a3a3a; }
        .controls button.danger:hover { background: #8a3a3a; }
        
        .mode-selector {
            display: flex;
            gap: 0.3rem;
            align-items: center;
            background: #0a1424;
            padding: 0.2rem 0.5rem;
            border-radius: 30px;
            border: 1px solid #1a2942;
        }
        .mode-selector button {
            background: transparent;
            border: none;
            color: #5a78a5;
            padding: 0.1rem 0.6rem;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.65rem;
            transition: 0.2s;
        }
        .mode-selector button.active {
            background: #1f2f4a;
            color: #f5d742;
        }
        .mode-selector button:hover { color: #f5d742; }
        
        .iframe-wrapper {
            background: #0a111f;
            border-radius: 16px;
            border: 1px solid #1f314a;
            overflow: hidden;
            height: calc(100vh - 140px);
            min-height: 400px;
            position: relative;
        }
        
        .iframe-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #0a111f;
        }
        
        .iframe-wrapper .fallback {
            display: none;
            width: 100%;
            height: 100%;
            padding: 1.5rem;
            overflow-y: auto;
            background: #0a111f;
        }
        
        .iframe-wrapper .fallback.active {
            display: block;
        }
        
        .iframe-wrapper .fallback .api-card {
            background: #111b2e;
            border-radius: 12px;
            border: 1px solid #1f314a;
            padding: 1rem;
            margin-bottom: 0.8rem;
        }
        
        .iframe-wrapper .fallback .api-card .balance {
            font-size: 1.8rem;
            color: #f5d742;
            font-weight: 600;
        }
        
        .iframe-wrapper .fallback .api-card .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        
        .iframe-wrapper .fallback .api-card .stat {
            background: #0a1424;
            padding: 0.4rem 0.6rem;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #1a2942;
        }
        
        .iframe-wrapper .fallback .api-card .stat .label {
            font-size: 0.55rem;
            color: #5a78a5;
            text-transform: uppercase;
        }
        
        .iframe-wrapper .fallback .api-card .stat .value {
            font-size: 0.85rem;
            color: #c8daf5;
            font-weight: 500;
        }
        
        .iframe-wrapper .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(10, 17, 31, 0.92);
            gap: 0.5rem;
            z-index: 10;
            pointer-events: none;
        }
        
        .iframe-wrapper .overlay.hidden { display: none; }
        .iframe-wrapper .overlay .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #1f2f4a;
            border-top-color: #f5d742;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .iframe-wrapper .overlay .msg { color: #7b99cc; font-size: 0.85rem; }
        
        .footer {
            margin-top: 0.5rem;
            padding: 0.5rem 1rem;
            background: #0e1628;
            border-radius: 16px;
            border: 1px solid #253349;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            font-size: 0.7rem;
            color: #3f5780;
        }
        .footer a { color: #7b99cc; text-decoration: none; }
        .footer a:hover { color: #f5d742; }
        
        .warning {
            background: #1f1a0e;
            border: 1px solid #b8860b;
            border-radius: 12px;
            padding: 0.4rem 0.8rem;
            margin-bottom: 0.5rem;
            color: #f5c542;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        
        @media (max-width: 768px) {
            .iframe-wrapper { height: calc(100vh - 200px); min-height: 300px; }
            .header h1 { font-size: 1rem; }
            .iframe-wrapper .fallback .api-card .stats { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <h1>⛓️ Mempool Live</h1>
        <div class="status">
            <span class="status-dot" id="liveDot"></span>
            <span id="liveStatus">🟢 На живо</span>
            <span>🕒 <span id="clock">--:--</span></span>
        </div>
        <div class="controls">
            <div class="mode-selector">
                <button class="active" onclick="setMode('iframe')" id="modeIframe">📦 iframe</button>
                <button onclick="setMode('api')" id="modeApi">📊 API</button>
            </div>
            <button onclick="reloadFrame()">🔄 Презареди</button>
            <button class="primary" onclick="switchProxy()">🔄 Смени прокси</button>
            <button onclick="openDirect()">📱 Отвори</button>
        </div>
    </div>

    <div class="warning">
        <span>⚠️</span>
        <span><strong>Mempool.space блокира iframe.</strong> Използваме <strong>CORS прокси</strong> за заобикаляне. Ако не се зарежда, превключете на <strong>API режим</strong>.</span>
        <span id="proxyLabel" style="font-size:0.6rem; color:#7b99cc;">прокси: corsproxy.io</span>
    </div>

    <div class="iframe-wrapper" id="wrapper">
        <iframe id="mainFrame" src="" loading="lazy" 
                sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"
                allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture">
        </iframe>
        
        <div class="fallback" id="fallback">
            <div id="apiContent"></div>
        </div>
        
        <div class="overlay" id="overlay">
            <div class="spinner"></div>
            <div class="msg">⏳ Зареждане на <span id="loadingLabel">mempool.space</span>...</div>
        </div>
    </div>

    <div class="footer">
        <span>⛓️ <a href="https://mempool.space" target="_blank">mempool.space</a></span>
        <span>⚡ <span id="footerProxy">corsproxy.io</span> · <span id="modeLabel">iframe режим</span></span>
    </div>

</div>

<script>
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  КОНФИГУРАЦИЯ
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    const ADDRESSES = [
        'bc1q7t4vyehjsexdme84qhdgd4dawcn54djh0m78fz',
        'bc1qwqdg6squsna38e46795at95yu9atm8azzmyvckulcc7kytlcckxswvvzej',
        'bc1qutf4rdlcgxlpflxu9nr6pcx024dksxezcwsxnd'
    ];

    const BLOCK_HASH = '00000000000000000000c04c4dcbaea675537b7a3e97146f87df83ce1c8d03b4';

    const PROXIES = [
        { name: 'corsproxy.io', url: 'https://corsproxy.io/?url=' },
        { name: 'api.allorigins.win', url: 'https://api.allorigins.win/raw?url=' }
    ];

    let currentProxyIndex = 0;
    let currentMode = 'iframe'; // 'iframe' или 'api'
    let currentTargetIndex = 0;

    const TARGETS = [
        `https://mempool.space/address/${ADDRESSES[0]}`,
        `https://mempool.space/address/${ADDRESSES[1]}`,
        `https://mempool.space/address/${ADDRESSES[2]}`,
        `https://mempool.space/block/${BLOCK_HASH}?page=2`
    ];

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  РЕЖИМИ
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('modeIframe').classList.toggle('active', mode === 'iframe');
        document.getElementById('modeApi').classList.toggle('active', mode === 'api');
        document.getElementById('modeLabel').textContent = mode === 'iframe' ? 'iframe режим' : 'API режим';
        
        if (mode === 'iframe') {
            document.getElementById('mainFrame').style.display = 'block';
            document.getElementById('fallback').classList.remove('active');
            loadFrame();
        } else {
            document.getElementById('mainFrame').style.display = 'none';
            document.getElementById('fallback').classList.add('active');
            loadApiData();
        }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  IFRAME РЕЖИМ
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    function loadFrame() {
        const iframe = document.getElementById('mainFrame');
        const target = TARGETS[currentTargetIndex];
        const proxy = PROXIES[currentProxyIndex];
        const url = proxy.url + encodeURIComponent(target);
        
        iframe.src = url;
        document.getElementById('proxyLabel').textContent = `прокси: ${proxy.name}`;
        document.getElementById('footerProxy').textContent = proxy.name;
        document.getElementById('loadingLabel').textContent = 'mempool.space';
        document.getElementById('overlay').classList.remove('hidden');
        
        console.log(`🔄 Зареждане (iframe): ${target} чрез ${proxy.name}`);
    }

    function switchProxy() {
        currentProxyIndex = (currentProxyIndex + 1) % PROXIES.length;
        if (currentMode === 'iframe') {
            loadFrame();
        }
    }

    function reloadFrame() {
        if (currentMode === 'iframe') {
            loadFrame();
        } else {
            loadApiData();
        }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  API РЕЖИМ (РЕЗЕРВЕН)
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    async function loadApiData() {
        const container = document.getElementById('apiContent');
        container.innerHTML = '<div style="text-align:center;padding:2rem;color:#5a78a5;">⏳ Зареждане на данни от API...</div>';
        
        let html = '';
        
        // Зареждане на адреси
        for (const addr of ADDRESSES) {
            try {
                const response = await fetch(`https://mempool.space/api/address/${addr}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                const chain = data.chain_stats || {};
                const balance = ((chain.funded_txo_sum || 0) - (chain.spent_txo_sum || 0)) / 100000000;
                const received = (chain.funded_txo_sum || 0) / 100000000;
                const spent = (chain.spent_txo_sum || 0) / 100000000;
                
                html += `
                    <div class="api-card">
                        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.3rem;">
                            <span style="font-size:0.7rem;color:#6f8fc0;font-family:monospace;">${addr}</span>
                            <span class="balance">${balance.toFixed(8)} BTC</span>
                        </div>
                        <div class="stats">
                            <div class="stat">
                                <div class="label">Транзакции</div>
                                <div class="value">${(chain.tx_count || 0).toLocaleString()}</div>
                            </div>
                            <div class="stat">
                                <div class="label">Получено</div>
                                <div class="value">${received.toFixed(4)} BTC</div>
                            </div>
                            <div class="stat">
                                <div class="label">Изпратено</div>
                                <div class="value">${spent.toFixed(4)} BTC</div>
                            </div>
                        </div>
                    </div>
                `;
            } catch (e) {
                html += `<div class="api-card" style="border-color:#6b2a2a;">
                    <span style="color:#ff7b7b;">❌ Грешка при зареждане на ${addr}</span>
                </div>`;
            }
        }
        
        // Зареждане на блок
        try {
            const response = await fetch(`https://mempool.space/api/block/${BLOCK_HASH}`);
            if (response.ok) {
                const data = await response.json();
                html += `
                    <div class="api-card" style="border-color:#2a4065;">
                        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.3rem;">
                            <span style="font-size:0.7rem;color:#6f8fc0;font-family:monospace;">${BLOCK_HASH.slice(0, 20)}...</span>
                            <span class="balance">#${data.height || '957111'}</span>
                        </div>
                        <div class="stats">
                            <div class="stat">
                                <div class="label">Транзакции</div>
                                <div class="value">${(data.tx_count || 0).toLocaleString()}</div>
                            </div>
                            <div class="stat">
                                <div class="label">Размер</div>
                                <div class="value">${data.size ? (data.size / 1000000).toFixed(2) + ' MB' : '--'}</div>
                            </div>
                            <div class="stat">
                                <div class="label">Тегло</div>
                                <div class="value">${data.weight ? (data.weight / 1000000).toFixed(2) + ' MWU' : '--'}</div>
                            </div>
                        </div>
                    </div>
                `;
            }
        } catch (e) {
            // Игнорираме
        }
        
        container.innerHTML = html || '<div style="text-align:center;padding:2rem;color:#ff7b7b;">❌ Грешка при зареждане на данни</div>';
        document.getElementById('overlay').classList.add('hidden');
        document.getElementById('liveStatus').textContent = '🟢 API режим';
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  ДИРЕКТНО ОТВАРЯНЕ
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    function openDirect() {
        window.open(TARGETS[currentTargetIndex], '_blank');
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  ЧАСОВНИК
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    function updateClock() {
        const now = new Date();
        const d = String(now.getDate()).padStart(2, '0');
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const y = now.getFullYear();
        const h = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('clock').textContent = `${d}.${m}.${y} ${h}:${min}`;
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  ИНИЦИАЛИЗАЦИЯ
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    document.addEventListener('DOMContentLoaded', function() {
        updateClock();
        setInterval(updateClock, 10000);
        
        // Стартираме в iframe режим
        setMode('iframe');
        
        // След 10 секунди, ако iframe не е зареден, превключваме на API
        setTimeout(() => {
            try {
                const iframe = document.getElementById('mainFrame');
                const doc = iframe.contentDocument || iframe.contentWindow?.document;
                if (!doc || doc.body.innerHTML.trim() === '' || doc.body.innerHTML.includes('Error')) {
                    console.log('⚠️ iframe не се зарежда, превключване към API режим');
                    setMode('api');
                    document.getElementById('liveStatus').textContent = '🟡 API режим (резерв)';
                } else {
                    document.getElementById('overlay').classList.add('hidden');
                    document.getElementById('liveStatus').textContent = '🟢 iframe режим';
                }
            } catch (e) {
                console.log('⚠️ iframe грешка, превключване към API режим');
                setMode('api');
                document.getElementById('liveStatus').textContent = '🟡 API режим (резерв)';
            }
        }, 10000);
        
        console.log('✅ Mempool Live зареден!');
        console.log('📌 Опитваме iframe, при грешка превключваме към API');
    });

    // Глобални функции
    window.setMode = setMode;
    window.switchProxy = switchProxy;
    window.reloadFrame = reloadFrame;
    window.openDirect = openDirect;
</script>

</body>
</html>
